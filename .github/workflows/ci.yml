name: CI

on:
  push:
  pull_request:

jobs:
  test-sqlite:
    name: Test (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (SQLite backend)
        run: pytest tests/ -v

  test-postgres:
    name: Test (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis_dev_password
          POSTGRES_DB: jarvis_skills_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (real Postgres backend, exercises DB-level triggers)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://jarvis:jarvis_dev_password@localhost:5432/jarvis_skills_test
        run: pytest tests/ -v

  docker-compose-boot:
    name: Docker Compose boots and answers /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Seed fixture organizations
        run: docker compose exec -T api python -m scripts.seed

      - name: Tear down
        if: always()
        run: docker compose down -v
